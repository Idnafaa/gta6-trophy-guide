<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Offline GTA VI trophy guide and tracker: all 55 PS5 trophies, roadmap to platinum, missable flags, cited guides.">
<title>Leonida Trophy Log · GTA VI trophy guide</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/checklist.css">
<link rel="stylesheet" href="css/roadmap.css">
<script type="module" src="js/main.js"></script>
</head>
<body data-view="checklist">
<header class="topbar">
  <div class="brand">
    <span class="sun" aria-hidden="true"></span>
    <div>
      <h1>Leonida Trophy Log</h1>
      <p class="tagline">GTA VI · all 55 PS5 trophies · offline guide &amp; tracker</p>
    </div>
  </div>
  <div id="hud" class="hud"></div>
</header>
<main id="app">
  <section id="checklist-view" class="checklist-view">
    <aside id="sidebar" class="sidebar" aria-label="Filters"></aside>
    <section class="list-pane" aria-label="Trophy checklist">
      <div class="list-head"><span>Trophy · official description</span><span id="list-count"></span></div>
      <ul id="list" class="list"></ul>
    </section>
    <article id="detail" class="detail" aria-live="polite"></article>
  </section>
  <section id="roadmap-view" class="roadmap-view" hidden></section>
  <aside id="drawer" class="drawer" hidden aria-label="Settings"></aside>
</main>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
